name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Validate packaged pricing
        run: php -r 'json_decode(file_get_contents("data/pricing.json"), true, 512, JSON_THROW_ON_ERROR);'
